<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACE / After Hours asset studio</title><link rel="icon" href="/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#edf0e5;background:#101315}
header{padding:15px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #35403e}
header a{color:#d8ef47}button,select{font:inherit;padding:10px 12px;min-height:44px;background:#edf0e5;color:#18201d;border:0}
label{font-weight:600}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d8ef47;outline-offset:4px}
button:disabled{cursor:wait;opacity:.6}#studio-view{position:relative;width:min(1200px,100vw);aspect-ratio:4/3;height:auto;background:radial-gradient(ellipse at 50% 42%,#283032 0%,#171d20 55%,#101315 100%)}
canvas{display:block;width:100%;height:100%}#status{padding:16px 24px;margin:0;max-width:1100px;line-height:1.6}
pre{padding:20px 24px;overflow:auto}body.capture header,body.capture #status,body.capture pre{display:none}
body.capture #studio-view{width:1200px;height:900px;max-width:none}
</style></head><body>
<header><a href="/">← PACE</a><strong>After Hours / Original asset studio</strong>
<label for="finish">Finish</label><select id="finish"><option value="volt">Volt / Graphite + acid</option><option value="ice">Ice / Pearl + cobalt</option><option value="infrared">Infrared / Charcoal + coral</option></select>
<label for="pose">View</label><select id="pose"><option value="hero">Hero</option><option value="side">Side</option><option value="knit">Knit</option><option value="heel">Heel</option><option value="sole">Sole</option><option value="threequarter">Three-quarter / optional</option><option value="top">Top / optional</option></select>
<button id="record">Record 8-second live model canvas</button><a id="download" hidden>Download recording</a></header>
<div id="studio-view" role="img" aria-label="Original PACE After Hours shoe rendered from consistent geometry"></div>
<p id="status" role="status">Preparing original geometry.</p><pre id="stats"></pre>
<script type="module" src="/src/studio.ts"></script></body></html>
