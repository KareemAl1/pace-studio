<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACE / Original asset studio</title><link rel="icon" href="/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#111;background:#f8f8f1}
header{padding:15px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header a{color:inherit}button,select{font:inherit;padding:12px;min-height:44px}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #173bf4;outline-offset:4px}
button:disabled{cursor:wait;opacity:.6}#studio-view{position:relative;width:1100px;height:850px;background:#f8f8f1;max-width:100vw}
canvas{display:block;width:100%;height:100%}#status{padding:16px;margin:0;max-width:1000px;line-height:1.6}
pre{padding:20px;overflow:auto}body.capture header,body.capture #status,body.capture pre{display:none}
body.capture #studio-view{width:100vw;height:100vh}body.capture[data-pose=hero] #studio-view{background:#173bf4}
</style></head><body>
<header><a href="/">← PACE</a><strong>Original model / asset studio</strong>
<label for="pose">View</label><select id="pose"><option value="hero">Hero</option><option value="side">Side</option><option value="threequarter">Three-quarter</option><option value="macro">Macro</option></select>
<button id="record">Record 8-second live model canvas</button><a id="download" hidden>Download recording</a></header>
<div id="studio-view" role="img" aria-label="Original PACE 01 product render from consistent geometry"></div>
<p id="status" role="status">Preparing original geometry.</p><pre id="stats"></pre>
<script type="module" src="/src/studio.ts"></script></body></html>
